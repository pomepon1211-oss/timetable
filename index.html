<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時間割 2026年6月〜7月</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
:root {
--blue-bg:#E6F1FB;--blue-bd:#B5D4F4;--blue-tx:#0C447C;
--green-bg:#EAF3DE;--green-tx:#3B6D11;
--other-bg:#F3EDFB;--other-bd:#C9A8F0;--other-tx:#5B2D8E;
--remote-bg:#FFF1E0;--remote-bd:#EDA94A;--remote-tx:#9A5512;
--exam-bg:#FDE7EA;--exam-bd:#E58A99;--exam-tx:#8E2433;
--surface:#fff;--page:#f4f6fb;--text:#1a1a2e;--muted:#6b7280;--bdr:rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--page);padding:12px 8px 40px;color:var(--text)}
h1{text-align:center;font-size:17px;font-weight:700;color:var(--blue-tx);margin-bottom:14px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav button{background:var(--surface);border:1px solid var(--bdr);border-radius:10px;padding:7px 13px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;color:var(--text)}
.nav button:hover{background:var(--blue-bg);color:var(--blue-tx)}
.nav button:disabled{opacity:.3;cursor:default}
.wlabel{font-size:13px;font-weight:700;text-align:center;flex:1}
.todaybar{text-align:center;margin-bottom:10px}
.todaybar button{background:var(--blue-bg);border:1px solid var(--blue-bd);color:var(--blue-tx);border-radius:10px;padding:6px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.grid{display:grid;gap:3px}
.dh{font-size:10px;font-weight:700;text-align:center;padding:4px 2px;border-radius:8px;color:var(--muted);line-height:1.4}
.dh.today{background:var(--blue-bg);color:var(--blue-tx)}
.tl{font-size:8px;color:var(--muted);text-align:right;padding-right:3px;line-height:1.4;display:flex;flex-direction:column;justify-content:center}
.cell{min-height:68px;border-radius:10px;padding:5px 5px 4px;font-size:10px;font-weight:500;line-height:1.35;display:flex;flex-direction:column;gap:3px}
.cell.tap{cursor:pointer;transition:transform .12s}
.cell.tap:active{transform:scale(.97)}
.cell.empty{background:rgba(0,0,0,.04)}
.cell.normal{background:var(--blue-bg);color:var(--blue-tx);border:1px solid var(--blue-bd)}
.cell.remote{background:var(--remote-bg);color:var(--remote-tx);border:2px solid var(--remote-bd)}
.rtag{font-size:8px;font-weight:700;opacity:.9}
.cell.exam{background:var(--exam-bg);color:var(--exam-tx);border:1px solid var(--exam-bd);min-height:78px}
.etag{font-size:8px;font-weight:700;opacity:.9}
.esubj{font-size:10px;font-weight:700;line-height:1.3}
.emeta{font-size:9px;font-weight:600}
.emeta2{font-size:8px;opacity:.85;line-height:1.3}
.dh.examdh{background:var(--exam-bg);color:var(--exam-tx)}
.exambanner{background:var(--exam-bg);color:var(--exam-tx);border:1px solid var(--exam-bd);border-radius:10px;padding:7px 10px;font-size:11px;font-weight:700;text-align:center;margin-bottom:10px;line-height:1.6}
.exambtn{background:var(--exam-bg)!important;border-color:var(--exam-bd)!important;color:var(--exam-tx)!important}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.ld{width:10px;height:10px;border-radius:3px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:320px}
.modal h2{font-size:16px;font-weight:700;margin-bottom:12px}
.mrow{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.5}
.mst{margin-top:10px;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:700;text-align:center;background:var(--green-bg);color:var(--green-tx)}
.mcls{margin-top:14px;width:100%;padding:10px;border:1px solid var(--bdr);background:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;color:var(--text)}
.mcls:hover{background:var(--page)}
.other-row-label{font-size:8px;color:var(--other-tx);text-align:right;padding-right:3px;line-height:1.4;display:flex;flex-direction:column;justify-content:center;font-weight:700}
.other-cell{background:var(--other-bg);border:1px solid var(--other-bd);border-radius:10px;padding:4px 5px;min-height:52px;display:flex;flex-direction:column;gap:2px}
.other-cell textarea{width:100%;flex:1;min-height:36px;border:none;background:transparent;font-family:'Noto Sans JP',sans-serif;font-size:9px;color:var(--other-tx);resize:none;outline:none;line-height:1.4}
.other-cell textarea::placeholder{color:var(--other-bd)}
.other-cell-label{font-size:8px;font-weight:700;color:var(--other-tx);opacity:0.7}
</style>

const today=new Date();
function ds(d){return d.toISOString().slice(0,10)}
function currentWeek(){
let idx=0;
WEEKS.forEach((w,i)=>{
const m=new Date(w.monday);
const f=new Date(m);f.setDate(f.getDate()+6);
if(today>=m&&today<=f) idx=i;
});
return idx;
}
let wi=currentWeek();
const examIndex=WEEKS.findIndex(w=>w.exam);

function saveOther(date,val){localStorage.setItem('other_'+date,val)}
function loadOther(date){return localStorage.getItem('other_'+date)||''}

function render(){
const w=WEEKS[wi];
document.getElementById('wl').textContent=w.label;
document.getElementById('bp').disabled=wi===0;
document.getElementById('bn').disabled=wi===WEEKS.length-1;
document.getElementById('exambanner').style.display=w.exam?'block':'none';

const active=w.days.filter(d=>{
const dow=new Date(d.date).getDay();
return (dow>=1&&dow<=5)||(dow===6&&d.classes.length>0);
});

const allT=new Set();
active.forEach(d=>d.classes.forEach(c=>{if(c.time)allT.add(c.time)}));
const periods=[...allT].sort();

const g=document.getElementById('grid');
g.innerHTML='';
g.style.gridTemplateColumns=`32px repeat(${active.length},1fr)`;

g.appendChild(document.createElement('div'));
active.forEach(d=>{
const dt=new Date(d.date);
const el=document.createElement('div');
el.className='dh'+(ds(dt)===ds(today)?' today':'')+(w.exam?' examdh':'');
el.innerHTML=`${DN[dt.getDay()-1]}<br>${dt.getMonth()+1}/${dt.getDate()}`;
g.appendChild(el);
});

if(periods.length===0){
const msg=document.createElement('div');
msg.style.cssText='grid-column:1/-1;text-align:center;padding:24px;color:var(--muted);font-size:13px;';
msg.textContent='授業はありません';
g.appendChild(msg);
appendOtherRow(g,active);
return;
}

periods.forEach(t=>{
const tl=document.createElement('div');
tl.className='tl';
const tm=TM[t]||{l:'',t};
tl.innerHTML=w.exam?t:`${tm.l}<br>${t}`;
g.appendChild(tl);
active.forEach(d=>{
const clsList=d.classes.filter(c=>c.time===t);
const el=document.createElement('div');
if(clsList.length===0){
el.className='cell empty';
} else if(w.exam){
const c=clsList[0];
el.className='cell exam tap';
const roomTxt=c.room&&c.room!=='201教室'?'・'+c.room:'';
const elec=c.elective?'・●選択':'';
el.innerHTML=`<span class="etag">📝 試験</span><span class="esubj">${c.subj}</span><span class="emeta">${c.time}〜${c.end}</span><span class="emeta2">${c.dur}${roomTxt}${elec}</span>`;
el.onclick=()=>smExam(c,d.date);
} else {
const isRemote=clsList.length>=2;
el.className='cell '+(isRemote?'remote':'normal')+' tap';
const tag=isRemote?'<span class="rtag">💻 リモート</span>':'';
el.innerHTML=tag+clsList.map(c=>`<span>${c.subj}</span>`).join('');
el.onclick=()=>sm(clsList.map(c=>c.subj).join('・'),t,d.date,isRemote);
}
g.appendChild(el);
});
});

appendOtherRow(g,active);
}

function appendOtherRow(g,active){
const lbl=document.createElement('div');
lbl.className='other-row-label';
lbl.innerHTML='その他<br>メモ';
g.appendChild(lbl);
active.forEach(d=>{
const cell=document.createElement('div');
cell.className='other-cell';
const cellLabel=document.createElement('div');
cellLabel.className='other-cell-label';
cellLabel.textContent='📝 その他';
cell.appendChild(cellLabel);
const ta=document.createElement('textarea');
ta.placeholder='予定を入力…';
ta.value=loadOther(d.date);
ta.addEventListener('input',()=>saveOther(d.date,ta.value));
cell.appendChild(ta);
g.appendChild(cell);
});
}

function sm(subj,time,date,remote){
const dt=new Date(date);
const tm=TM[time]||{l:'',t:time};
document.getElementById('mt').textContent=subj;
document.getElementById('md').textContent=`${dt.getMonth()+1}月${dt.getDate()}日（${DN[dt.getDay()-1]}）`;
document.getElementById('mti').textContent=`${tm.l} ${tm.t}`;
const st=document.getElementById('mst');
if(remote){st.textContent='💻 リモート授業';st.style.background='var(--remote-bg)';st.style.color='var(--remote-tx)';}
else{st.textContent='🟢 通常通り実施';st.style.background='var(--green-bg)';st.style.color='var(--green-tx)';}
