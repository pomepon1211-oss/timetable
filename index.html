const today=new Date();
function ds(d){return d.toISOString().slice(0,10)}
function currentWeek(){
let idx=0;
WEEKS.forEach((w,i)=>{
const m=new Date(w.monday);
const f=new Date(m);f.setDate(f.getDate()+6);
if(today>=m&&today<=f) idx=i;
});
return idx;
}
let wi=currentWeek();

function saveOther(date,val){localStorage.setItem('other_'+date,val)}
function loadOther(date){return localStorage.getItem('other_'+date)||''}

function render(){
const w=WEEKS[wi];
document.getElementById('wl').textContent=w.label;
document.getElementById('bp').disabled=wi===0;
document.getElementById('bn').disabled=wi===WEEKS.length-1;

const active=w.days.filter(d=>{
const dow=new Date(d.date).getDay();
return (dow>=1&&dow<=5)||(dow===6&&d.classes.length>0);
});

const allT=new Set();
active.forEach(d=>d.classes.forEach(c=>allT.add(c.time)));
const periods=PO.filter(t=>allT.has(t));

const g=document.getElementById('grid');
g.innerHTML='';
g.style.gridTemplateColumns=`32px repeat(${active.length},1fr)`;

g.appendChild(document.createElement('div'));
active.forEach(d=>{
const dt=new Date(d.date);
const el=document.createElement('div');
el.className='dh'+(ds(dt)===ds(today)?' today':'');
el.innerHTML=`${DN[dt.getDay()-1]}<br>${dt.getMonth()+1}/${dt.getDate()}`;
g.appendChild(el);
});

if(periods.length===0){
const msg=document.createElement('div');
msg.style.cssText='grid-column:1/-1;text-align:center;padding:24px;color:var(--muted);font-size:13px;';
msg.textContent='授業はありません';
g.appendChild(msg);
appendOtherRow(g,active);
return;
}

periods.forEach(t=>{
const tl=document.createElement('div');
tl.className='tl';
const tm=TM[t]||{l:'',t};
tl.innerHTML=`${tm.l}<br>${t}`;
g.appendChild(tl);
active.forEach(d=>{
const clsList=d.classes.filter(c=>c.time===t);
const el=document.createElement('div');
if(clsList.length===0){
el.className='cell empty';
} else {
const isRemote=clsList.length>=2||clsList.some(c=>c.remote);
el.className='cell '+(isRemote?'remote':'normal')+' tap';
const tag=isRemote?'<span class="rtag">💻 オンライン</span>':'';
el.innerHTML=tag+clsList.map(c=>`<span>${c.subj}</span>`).join('');
el.onclick=()=>sm(clsList.map(c=>c.subj).join('・'),t,d.date,isRemote);
}
g.appendChild(el);
});
});

appendOtherRow(g,active);
}

function appendOtherRow(g,active){
const lbl=document.createElement('div');
lbl.className='other-row-label';
lbl.innerHTML='その他<br>メモ';
g.appendChild(lbl);
active.forEach(d=>{
const cell=document.createElement('div');
cell.className='other-cell';
const cellLabel=document.createElement('div');
cellLabel.className='other-cell-label';
cellLabel.textContent='📝 その他';
cell.appendChild(cellLabel);
const ta=document.createElement('textarea');
ta.placeholder='予定を入力…';
ta.value=loadOther(d.date);
ta.addEventListener('input',()=>saveOther(d.date,ta.value));
cell.appendChild(ta);
g.appendChild(cell);
});
}

function sm(subj,time,date,remote){
const dt=new Date(date);
const tm=TM[time]||{l:'',t:time};
document.getElementById('mt').textContent=subj;
document.getElementById('md').textContent=`${dt.getMonth()+1}月${dt.getDate()}日（${DN[dt.getDay()-1]}）`;
document.getElementById('mti').textContent=`${tm.l} ${tm.t}`;
const st=document.getElementById('mst');
if(remote){st.textContent='💻 オンライン授業';st.style.background='var(--remote-bg)';st.style.color='var(--remote-tx)';}
else{st.textContent='🟢 通常通り実施';st.style.background='var(--green-bg)';st.style.color='var(--green-tx)';}
document.getElementById('ov').style.display='flex';
}
